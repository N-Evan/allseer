<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>allseer</title>
<style>
:root{
  --bg:#0e1116; --panel:#151a21; --panel2:#1b222b; --line:#252d38;
  --tx:#e6e9ef; --dim:#98a2b3; --dim2:#6b7684;
  --accent:#5b9cff; --niche:#c084fc; --ok:#37d399; --warn:#fbbf24; --bad:#f87171;
  --radius:12px;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f6f7f9;--panel:#fff;--panel2:#f0f2f5;--line:#e2e6ec;--tx:#131720;--dim:#5b6675;--dim2:#8a94a3;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:-.02em;font-size:18px}
.logo span{color:var(--accent)}
.grow{flex:1}
button{font:inherit;color:var(--tx);background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:7px 13px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:disabled{opacity:.5;cursor:not-allowed}
button.tab.on{background:var(--panel);border-color:var(--accent);color:var(--accent)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:7px 10px;width:100%}
main{max-width:1080px;margin:0 auto;padding:22px 20px 80px}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);margin:26px 0 10px}
h2 small{text-transform:none;letter-spacing:0;color:var(--dim2);font-weight:400;margin-left:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card h3{margin:2px 0 6px;font-size:17px;line-height:1.35}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--dim);font-size:12.5px}
.badge{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--dim)}
.badge.rank{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.badge.rank.n{background:var(--niche);border-color:var(--niche)}
.badge.st{text-transform:uppercase;letter-spacing:.05em}
.sum{margin:8px 0 0;color:var(--tx)}
.why{margin:8px 0 0;padding:8px 11px;border-left:3px solid var(--niche);background:var(--panel2);border-radius:0 8px 8px 0;font-size:14px}
.why b{color:var(--niche);font-size:11px;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.score{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--dim2);font-size:12px}
.bars{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.bar{font-size:11px;color:var(--dim2);background:var(--panel2);border-radius:6px;padding:2px 6px}
.empty{color:var(--dim);border:1px dashed var(--line);border-radius:var(--radius);padding:26px;text-align:center}
.status{font-size:12.5px;color:var(--dim);display:flex;gap:7px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim2)}
.dot.run{background:var(--warn);animation:p 1s infinite}
.dot.ok{background:var(--ok)}
.dot.bad{background:var(--bad)}
@keyframes p{50%{opacity:.25}}
pre.log{background:#0a0d12;color:#b8c2d0;border:1px solid var(--line);border-radius:10px;padding:12px;
  max-height:260px;overflow:auto;font-size:12px;white-space:pre-wrap}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40}
.drawer.on{display:block}
.sheet{position:absolute;right:0;top:0;bottom:0;width:min(680px,100%);background:var(--bg);
  border-left:1px solid var(--line);overflow:auto;padding:20px 22px 60px}
.facts li{margin-bottom:4px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13.5px;margin:10px 0}
.kv div:nth-child(odd){color:var(--dim)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.tr{border-bottom:1px solid var(--line);padding:9px 2px;display:flex;gap:10px;align-items:center;font-size:13.5px}
.md{white-space:pre-wrap}
.hint{font-size:12.5px;color:var(--dim2)}
label.f{display:block;margin-bottom:10px}
label.f span{display:block;font-size:12px;color:var(--dim);margin-bottom:3px}
</style>
</head>
<body>
<header>
  <div class="logo">all<span>seer</span></div>
  <button class="tab on" data-view="today">Today</button>
  <button class="tab" data-view="history">History</button>
  <button class="tab" data-view="settings">Settings</button>
  <div class="grow"></div>
  <div class="status" id="status"><i class="dot"></i><span>idle</span></div>
  <button class="primary" id="runBtn">Run Research Now</button>
  <button id="stopBtn" style="display:none;border-color:var(--bad);color:var(--bad)">Stop</button>
</header>

<main>
  <section id="view-today">
    <div class="card" style="cursor:default;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <input id="adhoc" placeholder="Research anything right now, e.g. RISC-V laptops, WebGPU inference..."
             style="flex:1;min-width:260px">
      <input id="adhocEx" placeholder="exclude (optional)" style="max-width:190px">
      <button class="primary" id="adhocBtn">Research this</button>
      <span class="hint">one-off - not saved as a topic</span>
    </div>
    <div class="row">
      <select id="topicFilter" style="max-width:260px"><option value="">All topics</option></select>
      <input id="search" placeholder="Search title, summary, tag, domain..." style="max-width:320px">
      <select id="bucketFilter" style="max-width:200px">
        <option value="">Ranked only</option>
        <option value="trending">Trending only</option>
        <option value="niche">Niche only</option>
        <option value="all">Everything discovered</option>
      </select>
      <span class="hint" id="runInfo"></span>
    </div>
    <div id="progressWrap" style="display:none">
      <h2>Progress <small id="phase"></small></h2>
      <pre class="log" id="log"></pre>
    </div>
    <div id="lists"></div>
  </section>

  <section id="view-history" style="display:none">
    <h2>Past runs</h2>
    <div id="runs"></div>
  </section>

  <section id="view-settings" style="display:none">
    <h2>Topics</h2>
    <div id="topics"></div>
    <div class="card" style="cursor:default">
      <div class="grid2">
        <label class="f"><span>New topic name</span><input id="tName" placeholder="Robotics startups"></label>
        <label class="f"><span>Keywords (comma separated)</span><input id="tKw" placeholder="humanoid, actuator, teleop"></label>
        <label class="f"><span>Exclusions</span><input id="tEx" placeholder="stock price, layoffs"></label>
      </div>
      <button class="primary" id="addTopic">Add topic</button>
    </div>

    <h2>Research settings</h2>
    <div class="card" style="cursor:default"><div class="grid2" id="settingsForm"></div>
      <button class="primary" id="saveSettings">Save settings</button>
      <button id="checkHealth">Check Ollama / SearXNG</button>
      <div class="hint" id="healthOut" style="margin-top:8px"></div>
    </div>
  </section>
</main>

<div class="drawer" id="drawer"><div class="sheet" id="sheet"></div></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api = async (p, o) => {
  const r = await fetch(p, o);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
};
let STATE = {}, VIEW = 'today', HIST = {run_id: null, day: null};

const SETTING_HELP = {
  ollama_url: 'Ollama base URL', ollama_model: 'Ollama model (e.g. llama3.1:8b)',
  searxng_url: 'SearXNG base URL - optional, leave blank to use the keyless providers only',
  queries_per_topic: 'Search queries generated per topic',
  max_fetch: 'Max pages to download per topic', max_llm: 'Max items scored by the LLM per topic',
  top_trending: 'Trending slots', top_niche: 'Niche slots', days_back: 'Freshness window (days)',
  providers: 'Enabled providers, comma separated (hn, reddit, github, arxiv, searxng)',
  user_agent: 'User-Agent used when fetching pages'
};

function when(iso){
  if(!iso) return 'date unknown';
  const d = new Date(iso); if(isNaN(d)) return String(iso).slice(0,10);
  const h = (Date.now() - d) / 36e5;
  if (h < 1) return Math.max(1, Math.round(h*60)) + 'm ago';
  if (h < 48) return Math.round(h) + 'h ago';
  return d.toISOString().slice(0,10);
}

function card(it){
  const isN = it.bucket === 'niche';
  const b = it.breakdown || {};
  const bars = ['relevance','novelty','depth','importance','recency','cross_source','discussion','low_coverage']
    .filter(k => b[k] != null).map(k => `<span class="bar">${k.replace('_',' ')} ${(b[k]*10).toFixed(1)}</span>`).join('');
  return `<article class="card" data-id="${it.id}">
    <div class="meta">
      ${it.rank ? `<span class="badge rank ${isN?'n':''}">${isN?'NICHE':'TOP'} ${it.rank}</span>` : ''}
      <span class="badge st">${esc(it.source_type||'other')}</span>
      <span>${esc(it.domain||'')}</span><span>&middot;</span><span>${when(it.published_at)}</span>
      ${it.cluster_domains>1?`<span class="badge">${it.cluster_domains} sources</span>`:''}
      ${it.discussion?`<span class="badge">${it.discussion} pts</span>`:''}
      <span class="badge">${esc(it.topic_name||'')}</span>
      <span class="score">T ${(it.trending_score||0).toFixed(3)} / N ${(it.niche_score||0).toFixed(3)}</span>
    </div>
    <h3>${esc(it.title)}</h3>
    ${it.llm_summary?`<p class="sum">${esc(it.llm_summary)}</p>`
      :`<p class="sum" style="color:var(--dim)">${esc((it.snippet||'').slice(0,240))}</p>`}
    ${it.llm_why?`<div class="why"><b>AI interpretation - why this matters</b>${esc(it.llm_why)}</div>`:''}
    <div class="bars">${bars}</div>
  </article>`;
}

function section(title, note, items){
  return `<h2>${title}<small>${note}</small></h2>` +
    (items.length ? items.map(card).join('') : `<div class="empty">Nothing here yet.</div>`);
}

async function loadResults(){
  const p = new URLSearchParams();
  if (HIST.run_id) p.set('run_id', HIST.run_id); else if (HIST.day) p.set('day', HIST.day);
  const t = $('#topicFilter').value, q = $('#search').value.trim(), b = $('#bucketFilter').value;
  if (t) p.set('topic_id', t);
  if (q) p.set('q', q);
  if (b) p.set('bucket', b);
  const {items} = await api('/api/results?' + p);
  const tr = items.filter(i => i.bucket === 'trending');
  const ni = items.filter(i => i.bucket === 'niche');
  const other = items.filter(i => !i.bucket);
  let html = '';
  if (b === 'niche') html = section('Niche finds', '', ni);
  else if (b === 'trending') html = section('Top stories', '', tr);
  else {
    html = section("Today's Top " + (tr.length||3), 'trending: recency + cross-source + relevance + quality + discussion', tr)
         + section('Niche finds', 'novelty + depth + importance + low coverage', ni);
    if (other.length) html += section('Everything else discovered', other.length + ' items, not shortlisted', other);
  }
  $('#lists').innerHTML = html;
  $('#runInfo').textContent = HIST.run_id ? 'run #' + HIST.run_id : (HIST.day || 'latest run');
}

async function loadState(){
  STATE = await api('/api/state');
  const tf = $('#topicFilter'), cur = tf.value;
  tf.innerHTML = '<option value="">All topics</option>' +
    STATE.topics.map(t => `<option value="${t.id}">${esc(t.name)}${t.enabled?'':' (off)'}</option>`).join('');
  tf.value = cur;
  renderStatus(STATE.status);
  renderTopics(); renderSettings(); renderRuns();
}

function renderStatus(s){
  const el = $('#status'), run = s.running;
  const cls = run ? 'run' : (s.error ? 'bad' : (s.phase === 'done' ? 'ok' : ''));
  el.innerHTML = `<i class="dot ${cls}"></i><span>${esc(run ? s.phase : (s.error || s.phase))}</span>`;
  $('#runBtn').disabled = run;
  $('#runBtn').textContent = run ? 'Researching...' : 'Run Research Now';
  $('#stopBtn').style.display = run ? '' : 'none';
  $('#adhocBtn').disabled = run;
  $('#progressWrap').style.display = (run || (s.log||[]).length) ? '' : 'none';
  $('#phase').textContent = s.topic ? ('topic: ' + s.topic) : '';
  const log = $('#log');
  const bottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
  log.textContent = (s.log || []).join('\n');
  if (bottom) log.scrollTop = log.scrollHeight;
}

function renderTopics(){
  $('#topics').innerHTML = STATE.topics.map(t => `<div class="card" style="cursor:default">
    <div class="row">
      <b>${esc(t.name)}</b>
      <span class="badge">${t.enabled ? 'enabled' : 'disabled'}</span>
      <div class="grow"></div>
      <button data-tg="${t.id}" data-on="${t.enabled?0:1}">${t.enabled?'Disable':'Enable'}</button>
      <button data-run="${t.id}">Run only this</button>
      <button data-del="${t.id}">Delete</button>
    </div>
    <div class="kv"><div>keywords</div><div>${esc(t.keywords||'-')}</div>
      <div>exclusions</div><div>${esc(t.exclusions||'-')}</div></div>
  </div>`).join('') || '<div class="empty">No topics yet.</div>';
}

function renderSettings(){
  $('#settingsForm').innerHTML = Object.entries(STATE.settings).map(([k,v]) =>
    `<label class="f"><span>${k} - ${esc(SETTING_HELP[k]||'')}</span>
      <input data-set="${k}" value="${esc(v)}"></label>`).join('');
}

function renderRuns(){
  $('#runs').innerHTML = (STATE.runs||[]).map(r => `<div class="tr">
    <b>#${r.id}</b><span>${esc(r.day||'')}</span>
    <span class="badge">${esc(r.status)}</span>
    <span class="hint">${esc((r.started_at||'').replace('T',' '))}</span>
    <span>${esc((r.subjects||'').slice(0,90) || 'nothing stored')}</span>
    <div class="grow"></div>
    <button data-open="${r.id}">Open</button></div>`).join('') || '<div class="empty">No runs yet.</div>';
}

async function openItem(id){
  const it = await api('/api/item/' + id);
  const facts = (it.llm_facts||[]);
  $('#sheet').innerHTML = `
    <div class="row"><button id="closeSheet">&larr; Close</button>
      <div class="grow"></div><span class="badge st">${esc(it.source_type)}</span>
      ${it.bucket?`<span class="badge rank ${it.bucket==='niche'?'n':''}">${it.bucket} #${it.rank}</span>`:''}</div>
    <h2 style="margin-top:16px">${esc(it.topic_name||'')}</h2>
    <h3 style="font-size:21px;margin:0 0 8px">${esc(it.title)}</h3>
    <div class="meta"><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.domain)} &nearr;</a>
      <span>&middot;</span><span>${when(it.published_at)}</span>${it.author?`<span>&middot;</span><span>${esc(it.author)}</span>`:''}</div>
    ${it.llm_summary?`<h2>Factual summary</h2><p>${esc(it.llm_summary)}</p>`:''}
    ${facts.length?`<h2>Stated in the source</h2><ul class="facts">${facts.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
    ${it.llm_why?`<h2>AI interpretation</h2><div class="why"><b>not from the source</b>${esc(it.llm_why)}</div>`:''}
    ${it.deep_analysis?`<h2>Analyst note <small>AI generated</small></h2><div class="md">${esc(it.deep_analysis)}</div>`:''}
    <h2>Signals</h2>
    <div class="bars">${Object.entries(it.breakdown||{}).map(([k,v])=>`<span class="bar">${k} ${v}</span>`).join('')}</div>
    <div class="kv">
      <div>trending score</div><div>${(it.trending_score||0).toFixed(4)}</div>
      <div>niche score</div><div>${(it.niche_score||0).toFixed(4)}</div>
      <div>independent sources</div><div>${it.cluster_domains}</div>
      <div>discussion</div><div>${it.discussion}</div>
      <div>found via</div><div>${esc((it.providers||[]).join(', '))}</div>
      <div>queries</div><div>${esc((it.queries||[]).join(' | '))}</div>
      <div>tags</div><div>${esc((it.llm_tags||[]).join(', '))}</div>
      <div>model</div><div>${esc(it.llm_model||'not scored')}</div>
      <div>run / day</div><div>#${it.run_id} &middot; ${esc(it.day||'')}</div>
      <div>extracted text</div><div>${it.content_chars} chars</div>
    </div>
    ${it.content?`<h2>Extracted text</h2><div class="md hint">${esc(it.content.slice(0,4000))}</div>`:''}`;
  $('#drawer').classList.add('on');
  $('#closeSheet').onclick = () => $('#drawer').classList.remove('on');
}

function show(v){
  VIEW = v;
  for (const n of ['today','history','settings']) $('#view-'+n).style.display = n===v ? '' : 'none';
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.view===v));
}

document.addEventListener('click', async e => {
  const t = e.target;
  if (t.dataset.view) show(t.dataset.view);
  if (t.id === 'runBtn') {
    try { await api('/api/run', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'}); }
    catch (err) { alert(err.message); }
    poll();
  }
  if (t.id === 'stopBtn') {
    t.disabled = true;
    try { await api('/api/stop', {method:'POST'}); } catch (err) { alert(err.message); }
    t.disabled = false;
  }
  if (t.id === 'adhocBtn') {
    const q = $('#adhoc').value.trim();
    if (!q) { $('#adhoc').focus(); return; }
    try {
      await api('/api/run', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({query: q, exclusions: $('#adhocEx').value})});
      show('today'); poll();
    } catch (err) { alert(err.message); }
  }
  const card = t.closest('.card[data-id]');
  if (card) openItem(card.dataset.id);
  if (t === $('#drawer')) $('#drawer').classList.remove('on');
  if (t.dataset.open) { HIST = {run_id: +t.dataset.open}; show('today'); loadResults(); }
  if (t.dataset.del && confirm('Delete this topic? Past results stay in the database.')) {
    await api('/api/topics/' + t.dataset.del, {method:'DELETE'}); loadState();
  }
  if (t.dataset.tg) {
    await api('/api/topics/' + t.dataset.tg, {method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({enabled: t.dataset.on === '1'})}); loadState();
  }
  if (t.dataset.run) {
    try { await api('/api/run', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({topic_ids:[+t.dataset.run]})}); show('today'); poll(); }
    catch (err) { alert(err.message); }
  }
  if (t.id === 'addTopic') {
    try {
      await api('/api/topics', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({name:$('#tName').value, keywords:$('#tKw').value, exclusions:$('#tEx').value})});
      $('#tName').value = $('#tKw').value = $('#tEx').value = ''; loadState();
    } catch (err) { alert(err.message); }
  }
  if (t.id === 'saveSettings') {
    const body = {};
    document.querySelectorAll('[data-set]').forEach(i => body[i.dataset.set] = i.value);
    await api('/api/settings', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    t.textContent = 'Saved'; setTimeout(() => t.textContent = 'Save settings', 1200); loadState();
  }
  if (t.id === 'checkHealth') {
    $('#healthOut').textContent = 'checking...';
    const h = await api('/api/health');
    $('#healthOut').textContent =
      'ollama: ' + (h.ollama.ok ? ('ok, model present=' + h.ollama.model_present + ', models: ' + (h.ollama.models||[]).join(', '))
                                : ('FAILED - ' + (h.ollama.error||'unreachable')))
      + ' | searxng configured: ' + h.searxng.configured;
  }
});

['#topicFilter','#bucketFilter'].forEach(s => $(s).addEventListener('change', loadResults));
$('#adhoc').addEventListener('keydown', e => { if (e.key === 'Enter') $('#adhocBtn').click(); });
let deb; $('#search').addEventListener('input', () => { clearTimeout(deb); deb = setTimeout(loadResults, 300); });

let wasRunning = false;
async function poll(){
  try {
    const s = await api('/api/status');
    renderStatus(s);
    if (wasRunning && !s.running) { await loadState(); HIST = {}; await loadResults(); }
    wasRunning = s.running;
  } catch {}
  setTimeout(poll, 2000);
}

loadState().then(loadResults).then(poll);
</script>
</body>
</html>
